{{- range .Values.dockerConfigs }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "es-{{ .name }}"
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ printf "{{ .dockerconfig | toString }}" }}
        config.json: >-
          {{ printf "{{ .dockerconfig | toString }}" }}
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: {{ .vaultKey }}
        property: {{ .vaultProperty }}
{{- end }}
