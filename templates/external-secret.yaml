{{- range .Values.externalSecrets }}
---
apiVersion: {{ .apiVersion | default $.Values.global.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  # Defaults to secretName, NOT "es-<secretName>". The prefix was baked in
  # before, which meant adopting this chart for an existing ExternalSecret
  # renamed it - and a renamed ExternalSecret is a new object, so ESO deletes
  # the old target Secret and creates a fresh one. Anything mounting it gets a
  # gap. Set `name` explicitly if you do want a different one.
  name: {{ .name | default .secretName }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- include "lib.annotations" (dict "item" . "global" $.Values.global) | nindent 2 }}
  {{- with .labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  secretStoreRef:
    name: {{ .secretStore | default $.Values.global.secretStore.name }}
    kind: {{ .secretStoreKind | default $.Values.global.secretStore.kind }}
  target:
    name: {{ .secretName }}
    {{- with .creationPolicy }}
    creationPolicy: {{ . }}
    {{- end }}
    {{- with .deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- if .immutable }}
    immutable: {{ .immutable }}
    {{- end }}
    {{- with .template }}
    template: {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
